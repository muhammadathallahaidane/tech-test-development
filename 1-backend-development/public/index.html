<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei Backend Test</title>
    <style>
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; }
        input { width: 100%; padding: .5rem; box-sizing: border-box; }
        button { padding: .5rem 1rem; cursor: pointer; }
        #response { margin-top: 1rem; padding: 1rem; background: #f0f0f0; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>Employee Data Submission</h1>
    
    <div style="border: 1px solid #ccc; padding: 20px; border-radius: 8px;">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="Enter name">
        </div>
        <div class="form-group">
            <label>Position</label>
            <input type="text" id="position" placeholder="Enter position">
        </div>
        <div class="form-group">
            <label>Salary (Number)</label>
            <input type="number" id="salary" placeholder="Enter salary">
        </div>
        <button onclick="submitData()">Submit Data</button>
        <div id="response"></div>
    </div>

    <h2 style="margin-top: 40px;">Employee List</h2>
    <button onclick="loadData()">Refresh List</button>
    <table id="employeeTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function submitData() {
            const name = document.getElementById('name').value;
            const position = document.getElementById('position').value;
            const salary = Number(document.getElementById('salary').value);

            const responseDiv = document.getElementById('response');
            
            try {
                const res = await fetch('/api/employee', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, position, salary })
                });

                const result = await res.json();
                
                responseDiv.style.display = 'block';
                responseDiv.style.backgroundColor = res.ok ? '#e8f5e9' : '#ffebee';
                responseDiv.innerText = JSON.stringify(result, null, 2);

                if (res.ok) loadData();
            } catch (err) {
                alert('Error connecting to server');
            }
        }

        async function loadData() {
            try {
                const res = await fetch('/api/employee');
                const result = await res.json();
                
                const tbody = document.querySelector('#employeeTable tbody');
                tbody.innerHTML = '';

                result.data.forEach(emp => {
                    const row = `<tr>
                        <td>${emp.id}</td>
                        <td>${emp.name}</td>
                        <td>${emp.position}</td>
                        <td>${emp.salary}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error(err);
            }
        }

        loadData();
    </script>
</body>
</html>
